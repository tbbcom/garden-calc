name: Probe live site
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          D=homegardenlot.com
          echo "== NS"; dig +short NS $D; echo "== apex"; dig +short A $D; echo "== www"; dig +short www.$D; echo "== tools"; dig +short tools.$D
          echo "== tools robots (non-comment lines)"; curl -s https://tools.$D/robots.txt | grep -v '^#' | grep -v '^$'
          sleep 5; echo "== www robots (non-comment lines)"; curl -s https://www.$D/robots.txt | grep -v '^#' | grep -v '^$' | head -40
          echo "== AdSense crawler + Googlebot + GPTBot + ClaudeBot on www/tools"
          for ua in "Mediapartners-Google" "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; GPTBot/1.2; +https://openai.com/gptbot)" "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; ClaudeBot/1.0; +claudebot@anthropic.com)" "Mozilla/5.0 (compatible; PerplexityBot/1.0)"; do
            sleep 4; a=$(curl -s -o /dev/null -w '%{http_code}' -A "$ua" https://tools.$D/frost-dates/); b=$(curl -s -o /dev/null -w '%{http_code}' -A "$ua" https://www.$D/); echo "tools=$a www=$b  $ua" | cut -c1-110
          done
          echo "== www cert"; echo | openssl s_client -servername www.$D -connect www.$D:443 2>/dev/null | openssl x509 -noout -issuer -enddate
          echo "== http->https on www"; curl -sI http://www.$D/ | grep -iE '^(HTTP|location|server)'
