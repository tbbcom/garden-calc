name: Probe live site
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          D=homegardenlot.com
          echo "== NS"; dig +short NS $D
          echo "== apex A"; dig +short A $D
          echo "== www"; dig +short www.$D
          echo "== tools"; dig +short tools.$D; dig +short AAAA tools.$D | head -2
          echo "== MX/TXT"; dig +short MX $D; dig +short TXT $D | head -5
          echo "== DNSSEC"; dig +short DS $D
          echo "== CAA"; dig +short CAA $D
          echo "== tools headers"; curl -sI https://tools.$D/ | grep -iE '^(HTTP|server|cf-ray|cf-cache-status|x-github-request-id|cache-control|location)'
          echo "== tools cert"; echo | openssl s_client -servername tools.$D -connect tools.$D:443 2>/dev/null | openssl x509 -noout -issuer -enddate
          echo "== robots (tools)"; curl -s https://tools.$D/robots.txt | head -20
          echo "== GTM on live tools pages"; curl -s "https://tools.$D/?v=$RANDOM" | grep -o 'gtm.js?id=[A-Za-z0-9-]*\|ns.html?id=[A-Za-z0-9-]*' || echo "NO GTM SNIPPET"
          echo "== www headers"; sleep 5; curl -sI https://www.$D/ | grep -iE '^(HTTP|server|cf-ray|location)'
          echo "== apex redirect"; curl -sI http://$D/ | grep -iE '^(HTTP|server|location)'
