name: Probe live site
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          H=https://tools.homegardenlot.com
          for p in / /frost-dates/ /frost-dates/texas/ /privacy/ /embed/frost-dates/; do echo "$p: $(curl -s "$H$p?v=$RANDOM" | grep -o 'gtm.js?id=[A-Z0-9-]*\|ns.html?id=[A-Z0-9-]*' | sort -u | tr '\n' ' ')"; done
          echo "== consent defaults present"; curl -s "$H/?v=$RANDOM" | grep -c "gtag('consent','default'"
          echo "== privacy text"; curl -s "$H/privacy/?v=$RANDOM" | grep -o 'We use <strong>Google Tag Manager</strong>\|does not currently use analytics' | head -1
          ID=$(curl -s "$H/?v=$RANDOM" | grep -o 'gtm.js?id=[A-Z0-9-]*' | head -1 | cut -d= -f2)
          if [ -n "$ID" ]; then echo "== container $ID published?"; curl -s -o /tmp/g -w "%{http_code} %{size_download}\n" "https://www.googletagmanager.com/gtm.js?id=$ID"; grep -o '"version":"[0-9]*"' /tmp/g | head -1; grep -oE 'G-[A-Z0-9]{6,12}' /tmp/g | sort -u | head -3; fi
          echo "== last deploys"; 
