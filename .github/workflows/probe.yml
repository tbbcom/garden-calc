name: Probe data sources
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://www.ncei.noaa.gov/data/normals-annualseasonal/1991-2020
          curl -sSI $B/archive/us-climate-normals_1991-2020_v1.0.1_annualseasonal_multivariate_by-station_c20230404.tar.gz | grep -i content-length
          for s in USW00094728 USC00042294 USW00023174 USC00502339; do curl -sSL -o $s.csv $B/access/$s.csv; done
          python3 - <<'PY'
          import csv,glob
          for f in sorted(glob.glob('*.csv')):
              r=list(csv.DictReader(open(f)))
              print(f, len(r), 'rows')
              for row in r[:1]:
                  print({k:row[k] for k in ['STATION','LATITUDE','LONGITUDE','ELEVATION','NAME','month','day','hour']})
                  for k,v in row.items():
                      if ('PRB' in k or 'GSL' in k) and ('T32' in k or 'T28' in k):
                          print(' ',k,'=',repr(v))
          PY
          curl -sSL $B/doc/Readme_By-Variable_By-Station_Normals_Files.txt | head -80
          curl -sSL $B/doc/inventory_30yr.txt | head -5
          curl -sSL $B/doc/Normals_ANN_1991-2020_sample.csv | head -c 1500
