name: Probe live site
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          H=tools.homegardenlot.com
          for u in "/" "/?nocache=$RANDOM" "/index.html"; do curl -s -o /tmp/o -w "%{http_code} %{size_download} $u " "https://$H$u"; grep -o '<title>[^<]*' /tmp/o; done
          curl -sI https://$H/ | grep -iE 'age:|x-cache|last-modified|etag'
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Lighthouse (mobile)
        run: |
          npx -y lighthouse@12 https://tools.homegardenlot.com/frost-dates/ --quiet --chrome-flags="--headless=new --no-sandbox" --only-categories=performance,seo,accessibility,best-practices --output=json --output-path=lh1.json || true
          npx -y lighthouse@12 "https://tools.homegardenlot.com/?v=$RANDOM" --quiet --chrome-flags="--headless=new --no-sandbox" --only-categories=performance,seo,accessibility,best-practices --output=json --output-path=lh2.json || true
          for f in lh1.json lh2.json; do node -e '
          const r=require("./'$f'");const c=r.categories,a=r.audits;
          console.log(r.finalDisplayedUrl);
          console.log(Object.entries(c).map(([k,v])=>k+"="+Math.round(v.score*100)).join(" "));
          for(const k of ["first-contentful-paint","largest-contentful-paint","total-blocking-time","cumulative-layout-shift","speed-index","server-response-time"]) console.log(" ",k,a[k]&&a[k].displayValue);
          for(const [k,v] of Object.entries(a)) if(v.score!==null&&v.score<0.9&&v.scoreDisplayMode!=="informative"&&v.scoreDisplayMode!=="notApplicable") {console.log("  FAIL",k,"-",v.title,v.displayValue||"");for(const it of ((v.details&&v.details.items)||[]).slice(0,6))console.log("     ",(it.node&&(it.node.selector+" | "+(it.node.snippet||"").slice(0,90)))||it.url||JSON.stringify(it).slice(0,160));}
          ' || echo "lighthouse failed for $f"; done
