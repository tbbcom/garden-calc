name: Build zone data

# Downloads the official USDA 2023 hardiness-zone-by-ZIP files and commits
# data/zones/*.json for the planting calendar. Runs when the builder changes,
# on demand, and once a year in case PRISM publishes corrections.
on:
  push:
    branches: [main]
    paths: ['scripts/build-zone-data.mjs']
  schedule:
    - cron: '23 3 2 1 *' # 2 January
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-zone-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build data/zones
        run: node scripts/build-zone-data.mjs

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/zones
          git diff --cached --quiet || { git commit -m "Update USDA zone data $(date -u +%F) [skip ci]" && git push; }
