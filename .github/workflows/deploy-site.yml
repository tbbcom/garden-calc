name: Deploy tool site

# Builds tools.homegardenlot.com from site-src/ + data/frost/ + data/zones/ and publishes it to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions"; Custom domain: tools.homegardenlot.com.
on:
  push:
    branches: [main]
    paths: ['site-src/**', 'scripts/build-site.mjs', 'scripts/zip-state.mjs', 'data/frost/**', 'data/zones/**', '.github/workflows/deploy-site.yml']
  workflow_run:
    workflows: ['Build frost data', 'Build zone data']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build site
        run: node scripts/build-site.mjs
        env:
          GTM_ID: ${{ vars.GTM_ID }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
