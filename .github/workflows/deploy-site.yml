name: Deploy tool site

# Builds tools.homegardenlot.com from site-src/ + data/frost/ + data/zones/ and publishes it to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions"; Custom domain: tools.homegardenlot.com.
on:
  push:
    branches: [main]
    paths: ['site-src/**', 'scripts/build-site.mjs', 'scripts/zip-state.mjs', 'data/frost/**', 'data/zones/**', '.github/workflows/deploy-site.yml']
  workflow_run:
    workflows: ['Build frost data', 'Build zone data']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.changed.outputs.urls }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      # Content hashes of the pages currently live, to compare with this build (empty on the first deploy).
      - name: Fetch live page hashes
        run: curl -fsS "https://tools.homegardenlot.com/page-hashes.json?v=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/old-hashes.json" || echo '{}' > "$RUNNER_TEMP/old-hashes.json"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build site
        run: node scripts/build-site.mjs
        env:
          GTM_ID: ${{ vars.GTM_ID || secrets.GTM_ID }}

      - name: Find changed pages
        id: changed
        run: |
          urls=$(node scripts/indexnow-diff.mjs "$RUNNER_TEMP/old-hashes.json" _site/page-hashes.json https://tools.homegardenlot.com)
          echo "$urls" | jq -r '"\(length) changed page(s)", .[]' | head -40
          echo "urls=$urls" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Optional: clears Cloudflare's cache for the tools site after each deploy, so a long edge cache
  # never serves stale pages. Needs secrets CF_ZONE_ID and CF_API_TOKEN (Zone → Cache Purge → Purge);
  # without them this job just says so and succeeds.
  purge-cloudflare:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Purge Cloudflare cache for tools.homegardenlot.com
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then echo "Cloudflare secrets not set; skipping purge."; exit 0; fi
          sleep 20
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" \
            --data '{"hosts":["tools.homegardenlot.com"]}' | grep -q '"success":true' && echo "Cloudflare cache purged." || { echo "::warning::Cloudflare purge failed; check CF_ZONE_ID / CF_API_TOKEN"; exit 0; }

  # Tells IndexNow (Bing, Yandex, Seznam, Naver) about pages whose content changed in this deploy, after
  # Cloudflare's cache is purged so crawlers fetch the new version. Bing's index also feeds ChatGPT search
  # and Copilot. Google doesn't use IndexNow; it reads the sitemap submitted in Search Console.
  # Submitting only changed URLs follows the IndexNow guidance. A failure here never blocks the deploy.
  indexnow:
    needs: [build, purge-cloudflare]
    if: needs.build.outputs.changed != '' && needs.build.outputs.changed != '[]'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: scripts/build-site.mjs
          sparse-checkout-cone-mode: false

      - name: Submit changed URLs to IndexNow
        env:
          URLS: ${{ needs.build.outputs.changed }}
        run: |
          key=$(grep -oP "INDEXNOW_KEY = '\K[0-9a-f]+" scripts/build-site.mjs)
          sleep 30 # let GitHub Pages and Cloudflare serve the new build
          jq -n --arg key "$key" --argjson u "$URLS" \
            '{host:"tools.homegardenlot.com", key:$key, keyLocation:("https://tools.homegardenlot.com/" + $key + ".txt"), urlList:$u}' > body.json
          echo "Submitting $(jq '.urlList | length' body.json) changed URL(s)"
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code} (200/202 = accepted)\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data @body.json
